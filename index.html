<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mari Froes · Nutricionista Funcional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #f5f1ea;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .container {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeUp 0.6s ease both;
  }

  .insta-handle {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 13px;
    color: #888;
    margin-bottom: 12px;
    letter-spacing: 0.04em;
  }

  .insta-icon {
    width: 16px;
    height: 16px;
    opacity: 0.5;
  }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px;
    font-weight: 600;
    color: #2a2a2a;
    line-height: 1.1;
    margin-bottom: 8px;
  }

  .title {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #3d7a6a;
  }

  .divider {
    width: 32px;
    height: 2px;
    background: #3d7a6a;
    margin: 14px auto 0;
    border-radius: 2px;
  }

  /* CARDS */
  .cards {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    width: 100%;
    background: #3d7a6a;
    border-radius: 16px;
    padding: 22px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    animation: fadeUp 0.6s ease both;
    overflow: hidden;
    position: relative;
  }

  .card:nth-child(1) { animation-delay: 0.15s; }
  .card:nth-child(2) { animation-delay: 0.25s; background: #4a3980; }
  .card:nth-child(3) { animation-delay: 0.35s; background: #7a4a3d; }

  .card::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
    pointer-events: none;
  }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.18);
  }

  .card-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    color: white;
    line-height: 1.25;
    max-width: 220px;
  }

  .card-arrow {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .card:hover .card-arrow {
    background: rgba(255,255,255,0.25);
  }

  .card-arrow svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: white;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* FOOTER */
  .footer {
    margin-top: 36px;
    font-size: 12px;
    color: #aaa;
    text-align: center;
    animation: fadeUp 0.6s ease 0.5s both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="insta-handle">
      <svg class="insta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
      @marifroes
    </div>
    <div class="name">Mari Froes</div>
    <div class="title">Nutricionista Funcional</div>
    <div class="divider"></div>
  </div>

  <div class="cards">

    <a class="card" href="https://wa.me/34684291653?text=Olá%20Mari%2C%20quero%20marcar%20minha%20consulta">
      <div class="card-text">Quero marcar minha consulta</div>
      <div class="card-arrow">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </a>

    <a class="card" href="desinflama-voce.html">
      <div class="card-text">Quero conhecer o Desinflama Você 40+</div>
      <div class="card-arrow">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </a>

    <a class="card" href="https://wa.me/34684291653?text=Olá%20Mari%2C%20quero%20saber%20mais%20sobre%20o%20Reset%2040%2B">
      <div class="card-text">Quero conhecer o Reset 40+</div>
      <div class="card-arrow">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </a>

  </div>

  <div class="footer">
    Madrid · Consultas online para Brasil e Europa
  </div>

</div>

</body>
</html>
